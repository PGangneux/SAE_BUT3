name: Django CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      neo4j:
        image: neo4j:latest
        ports:
          - 17687:7687            # mappe le bolt (7687) vers 17687 sur le runner
          - 17474:7474             # (optionnel) HTTP browser si besoin
        env:
          NEO4J_AUTH: "neo4j/testtest"
        options: >-
          --health-cmd="cypher-shell -u neo4j -p testtest 'RETURN 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (optional)
        run: |
          sudo apt-get update
          # netcat non strict nécessaire ; on utilise /dev/tcp, mais laisse si besoin
          sudo apt-get install -y ca-certificates

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for Neo4j bolt port to be ready
        # On utilise /dev/tcp to tester la connexion TCP sur localhost:17687
        run: |
          echo "Waiting for Neo4j on localhost:17687..."
          for i in $(seq 1 60); do
            if bash -c "</dev/tcp/localhost/17687" >/dev/null 2>&1; then
              echo "Neo4j is up (port 17687 reachable)"
              break
            fi
            echo "Trying ($i/60)..."
            sleep 2
          done
          # Optional: fail if still not up
          if ! bash -c "</dev/tcp/localhost/17687" >/dev/null 2>&1; then
            echo "Neo4j did not become ready in time" >&2
            docker logs $(docker ps -q --filter ancestor=neo4j:5) || true
            exit 1
          fi

      - name: Run Django tests
        run: |
          # Optionnel: export DJANGO_SETTINGS_MODULE si tu as un settings_test
          # export DJANGO_SETTINGS_MODULE=API.settings_test
          python ./backend/manage.py test API
